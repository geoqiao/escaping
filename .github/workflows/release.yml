name: Release

# Pushing a version tag publishes the escpe package to PyPI.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: false
      - name: Check that the tag is the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(uv version --short)
          if [ "$TAG" != "v$version" ]; then
            echo "::error title=Version mismatch::The tag is $TAG but pyproject.toml says $version."
            exit 1
          fi
      - name: Build the sdist and the wheel
        run: uv build --python 3.14 --out-dir dist
      - name: Run the built wheel
        run: |
          set -euo pipefail
          uv run --isolated --no-project --python 3.14 --with dist/*.whl escpe export --help > /dev/null
      - name: Keep the package for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusts this workflow and this environment; no token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/escpe/
    permissions:
      id-token: write
    steps:
      - name: Get the built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: dist
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          enable-cache: false
      - name: Publish
        run: uv publish --trusted-publishing always dist/*
