name: Build site

'on':
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted, transferred]
  push:
  workflow_dispatch:

permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  labels:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create missing publishing labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="published:0e8a16 type:blog:1d76db type:idea:d876e3 type:about:5319e7"
          have() { gh label list --limit 1000 --json name --jq '.[].name' | grep -qixF "$1"; }
          for spec in $labels; do
            name=${spec%:*}
            have "$name" || gh label create "$name" --color "${spec##*:}" || have "$name"
          done
          echo "Publishing labels are ready. Give an Issue one type:* label and published." >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pages: read
    outputs:
      skipped-issues: ${{ steps.site.outputs.skipped-issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: site
        uses: geoqiao/escaping@v0.4.0 # Or a full commit SHA.
        with:
          config: config.yaml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.site.outputs.output }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Report skipped Issues
        if: needs.build.outputs.skipped-issues != ''
        env:
          SKIPPED: ${{ needs.build.outputs.skipped-issues }}
        run: |
          echo "::error title=Some Issues were not published::Issues $SKIPPED have errors; the build job summary says what to fix. Everything else is live."
          exit 1
