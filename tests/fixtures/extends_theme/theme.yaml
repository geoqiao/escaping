# Extends the built-in Quiet: overrides two partials, adds an option and the
# templates for two extra pages (now.html, project.html). The site turns those
# pages on under pages.extra in its config.yaml.
api: 4
extends: quiet

options:
  now_text:
    type: string
    default: Working on escaping.
    description: Shown on /now/ and in a head meta tag.

strings:
  en:
    now_title: Now
    footer_thanks: Thanks for stopping by.
  zh:
    now_title: 现在
