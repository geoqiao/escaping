<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="geoqiao.me 前端视觉方向 throwaway prototype">
  <title>geoqiao.me — visual direction prototype</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./prototype.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#prototype-main">跳到主要内容</a>
  <div id="app">
    <noscript>这个视觉 demo 需要启用 JavaScript 才能切换方案。</noscript>
  </div>

  <aside class="prototype-tools" aria-label="Prototype controls">
    <span class="prototype-mark" aria-hidden="true">PROTOTYPE</span>
    <button class="variant-arrow" id="variant-prev" type="button" aria-label="上一个视觉方向">←</button>
    <div class="variant-current" aria-live="polite">
      <strong id="variant-key">A</strong>
      <span id="variant-name">Signal Ledger</span>
    </div>
    <button class="variant-arrow" id="variant-next" type="button" aria-label="下一个视觉方向">→</button>
  </aside>
</body>
</html>
