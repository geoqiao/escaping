# escaping site Config — a full reference; almost every field is optional.
#
# Two layers:
#   * Site fields (github, site, profile, about, paths, projects, comments,
#     seo, security) keep their meaning whichever Theme you use.
#   * theme.options belong to the Theme; its theme.yaml lists them.
#
# In the GitHub Action, the repository, site.url, title, author, avatar and
# bio default to your repository and public GitHub profile. For a local build
# set github.repo and site.url here. See docs/site-inputs.md.

github:
  repo: username/username.github.io
  # Only Issues by these accounts are published. Required for an
  # Organization; defaults to the repository owner for a personal account.
  allowed_authors:
    - username

site:
  title: "Blog Title"
  url: https://username.github.io/
  author: Your Name
  description: Short description
  language: en # Also picks the Theme's UI strings, e.g. zh for Chinese.
  # The full default menu. An explicit items list replaces it; use items: []
  # for none. Links to site pages must point at pages that exist.
  # navigation:
  #   items:
  #     - name: Home
  #       url: /
  #     - name: Blog
  #       url: /blog/
  #     - name: Projects
  #       url: /projects/
  #     - name: Tags
  #       url: /tags/
  #     - name: About
  #       url: /about/
  #     - name: RSS
  #       url: /atom.xml

profile:
  avatar: https://github.com/username.png
  # bio: A short bio. Without an About Issue, the About page shows it.
  links:
    - name: GitHub
      url: https://github.com/username

# Omit to use the oldest published type:about Issue, or the profile bio when
# there is none. A number set here must be a valid About Issue.
# about:
#   issue_number: 1

# paths:
#   output: output   # Replaced on every build; keep your own files elsewhere.
#   page_size: 10

theme:
  use: quiet # A built-in Theme, or a directory next to this file: ./theme
  # options: # Quiet's options; see docs/themes/quiet.md.
    # tagline: Researcher / tool builder
    # featured_posts: [41, 62, 49] # Blog Issue numbers shown on Home
    # footer_text: Thanks for reading.
    # show_powered_by: true
    # accent_color: "#a72f6a"
    # accent_color_dark: "#e58bb6"
    # comments_theme: github-light
    # comments_theme_mode: auto # auto follows light/dark; fixed uses comments_theme

# comments:
#   # Also authorize https://github.com/apps/utterances for the repository.
#   enabled: false
#   repo: "" # Defaults to github.repo.

# seo:
#   google_search_console: ""
#   social_image: https://example.com/social/og.png # or a Theme asset: /assets/images/og.png
#   social_image_alt: "A short description of the image"

