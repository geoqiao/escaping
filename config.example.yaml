# escaping site Config — a full reference; almost every field is optional.
#
# Two layers:
#   * Site fields (github, site, profile, about, paths, pages, redirects,
#     projects, comments, seo, security) keep their meaning whichever Theme
#     you use.
#   * theme.options belong to the Theme; its theme.yaml lists them.
#
# In the GitHub Action, the repository, site.url, title, author, avatar and
# bio default to your repository and public GitHub profile. For a local build
# set github.repo and site.url here. See docs/site-inputs.md.

github:
  repo: username/username.github.io
  # Only Issues by these accounts are published. Required for an
  # Organization; defaults to the repository owner for a personal account.
  allowed_authors:
    - username

site:
  title: "Blog Title"
  url: https://username.github.io/ # A project site: https://username.github.io/repo/
  author: Your Name
  description: Short description
  language: en # Also picks the Theme's UI strings, e.g. zh for Chinese.
  # Left out, the menu is Home, Blog, then Projects, Tags and About when those
  # pages are on, then RSS. An items list replaces it; use items: [] for none.
  # Links to site pages must point at pages that exist.
  # navigation:
  #   items:
  #     - name: Home
  #       url: /
  #     - name: Blog
  #       url: /blog/
  #     - name: Projects
  #       url: /projects/
  #     - name: Tags
  #       url: /tags/
  #     - name: About
  #       url: /about/
  #     - name: RSS
  #       url: /atom.xml

profile:
  avatar: https://github.com/username.png
  # bio: A short bio. Without an About Issue, the About page shows it.
  links:
    - name: GitHub
      url: https://github.com/username

# Omit to use the oldest published type:about Issue, or the profile bio when
# there is none. A number set here must be a valid About Issue.
# about:
#   issue_number: 1

# paths:
#   output: output   # Replaced on every build; keep your own files elsewhere.
#   page_size: 10

# Which pages the site has and at which address. Home is always /. Each
# section is a path, or false to turn it off; the Blog is always on. The Theme
# needs tags.html and projects.html while those pages are on.
# pages:
#   blog: /blog/ # posts at /blog/<slug>/, older pages at /blog/page/2/
#   ideas: /ideas/ # Ideas at /ideas/<number>/
#   tags: /tags/ # one page per tag at /tags/<tag>/
#   projects: /projects/
#   about: /about/
#   # More pages, each rendered by a template of your Theme, e.g.:
#   #   - path: /now/
#   #     template: now.html
#   #   - path: /projects/{slug}/ # one page per project
#   #     template: project.html
#   #     for_each: projects
#   extra: []

# Old addresses that moved, each to a page of this site. escaping writes a
# small page at the old address that sends visitors and search engines on.
# End an old address with / (covers /old and /old/) or .html. A redirect to a
# page that does not exist, or from an address that is a page again, is left
# out with a warning.
# redirects:
#   /blog/old-slug/: /blog/new-slug/
#   /old-about.html: /about/

theme:
  use: quiet # A built-in Theme, a directory next to this file (./theme), or
  # github.com/OWNER/REPOSITORY/FOLDER@VERSION; see docs/themes/authoring.md.
  # options: # Quiet's options; see docs/themes/quiet.md.
    # tagline: Researcher / tool builder
    # featured_posts: [41, 62, 49] # Blog Issue numbers shown on Home
    # footer_text: Thanks for reading.
    # show_powered_by: true
    # accent_color: "#a72f6a"
    # accent_color_dark: "#e58bb6"
    # comments_theme: github-light
    # comments_theme_mode: auto # auto follows light/dark; fixed uses comments_theme

# comments:
#   # Also authorize https://github.com/apps/utterances for the repository.
#   enabled: false
#   repo: "" # Defaults to github.repo.

# seo:
#   google_search_console: ""
#   social_image: https://example.com/social/og.png # or a Theme asset: /assets/images/og.png
#   social_image_alt: "A short description of the image"

# projects:
#   # A repository alone is enough; title and summary come from GitHub.
#   - repository: username/project
#   # Every field:
#   - repository: username/other-project # or leave it out and set website
#     website: https://example.com/ # the title links here when set
#     slug: other-project # default: the repository name in kebab case
#     title: Other Project
#     summary: A great project
#     featured: true # shown on Home and About
#     order: 1
#     image: https://example.com/preview.webp # or a Theme asset: /assets/images/p.webp
#     links:
#       - name: Demo
#         url: https://demo.example.com/
#     fallback_metadata: # used when GitHub cannot be read
#       stars: 100
#       language: Python

# The NAME of the environment variable holding the GitHub token, never the token.
# security:
#   token_env: GITHUB_TOKEN
