# ============================================
# Core (required)
# ============================================
github:
  repo: username/username.github.io
  allowed_authors:
    - username

site:
  title: "Blog Title"
  url: https://username.github.io/
  author: Your Name
  description: Short description
  language: en
  # Optional Theme presentation hint retained for local Theme compatibility.
  # The bundled Themes currently do not render thesis; a non-empty value with
  # one of them emits a build warning. geoqiao.me intentionally has no slogan.
  # thesis:
  #   - A deliberate statement about your site's perspective.
  #   - A second line, when the thought needs one.
  # navigation:          # optional
  #   items:
  #     - name: Blog
  #       url: /blog/
  #     - name: Ideas
  #       url: /ideas/
  #     - name: Projects
  #       url: /projects/
  #     - name: Tags
  #       url: /tags/
  #     - name: About
  #       url: /about/

profile:
  avatar: https://github.com/username.png
  # Optional Theme-specific profile copy. geoqiao.me intentionally keeps it
  # out of Home and About; local Themes may consume either field.
  # tagline: Researcher / tool builder
  # bio: A short bio about yourself.
  links:
    - name: GitHub
      url: https://github.com/username

about:
  issue_number: 1

security:
  token_env: GITHUB_TOKEN

# ============================================
# Branding (optional)
# ============================================
# branding:
#   show_powered_by: true
#   powered_by_text: Powered by
#   powered_by_url: https://github.com/geoqiao/escaping
#   source_link_url: ""

# ============================================
# Paths (optional)
# page_size is a positive integer, default 10
# ============================================
# paths:
#   output: output
#   page_size: 10

# ============================================
# Theme (optional; defaults to built-in geoqiao.me)
# Local Theme paths are relative to this Config file's directory.
# ============================================
theme:
  source: builtin
  name: geoqiao.me

# Local Theme example:
# theme:
#   source: local
#   name: my-theme
#   path: theme

# ============================================
# SEO (optional)
# ============================================
# seo:
#   google_search_console: ""

# ============================================
# Comments (optional)
# repo falls back to github.repo when empty
# theme_mode: auto follows the blog theme; fixed uses comments.theme
# ============================================
# comments:
#   repo: ""
#   theme: github-light
#   theme_mode: auto

# ============================================
# Projects (optional)
# ============================================
# projects:
#   - slug: my-project
#     title: My Project
#     repository: username/project
#     summary: A great project
#     featured: true
#     order: 1
#     fallback_metadata:
#       stars: 100
#       forks: 10
#       language: Python
#       topics:
#         - web
