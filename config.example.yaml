# ============================================
# Paths (optional)
# Built-in themes: Escape1 (minimal), Escape2 (dark terminal)
# page_size is a positive integer, default 10
# ============================================
# paths:
#   output: output
#   theme: Escape2
#   blog: blog
#   tag: tag
#   rss: atom.xml
#   about: about.html
#   page: page
#   page_size: 10

