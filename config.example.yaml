# ============================================
# Core (required)
# ============================================
github:
  repo: username/username.github.io
  allowed_authors:
    - username

site:
  title: "Blog Title"
  url: https://username.github.io/
  author: Your Name
  description: Short description
  language: en
  # navigation:          # optional
  #   items:
  #     - name: Blog
  #       url: /blog/
  #     - name: Tags
  #       url: /tag/
  #     - name: About
  #       url: /about.html
  #     - name: RSS
  #       url: /atom.xml

profile:
  avatar: https://github.com/username.png
  bio: |
    A short bio about yourself.
  links:
    - name: GitHub
      url: https://github.com/username

about:
  issue_number: 1

security:
  token_env: G_T

