# ============================================
# Expanded explicit reference, not a mandatory-field checklist.
# Missing fields resolve from trusted context + public owner profile.
# Without --context, github.repo and a real root site.url must be explicit;
# Organization owners must also provide allowed_authors. See docs/site-inputs.md.
# Comments default off; enabling also requires Utterances App authorization.
# Profile About never has a discussion thread.
# Core overrides
# ============================================
github:
  repo: username/username.github.io
  allowed_authors:
    - username

site:
  title: "Blog Title"
  url: https://username.github.io/
  author: Your Name
  description: Short description
  language: en
  # Optional presentation hint for local Themes. Quiet does not render thesis.
  # thesis:
  #   - A deliberate statement about your site's perspective.
  #   - A second line, when the thought needs one.
  # This is the full default menu. An explicit items list replaces it entirely;
  # reorder/rename/remove entries, or use items: []. The brand still links Home.
  # navigation:
  #   items:
  #     - name: Home
  #       url: /
  #     - name: Blog
  #       url: /blog/
  #     - name: Projects
  #       url: /projects/
  #     - name: Tags
  #       url: /tags/
  #     - name: About
  #       url: /about/
  #     - name: RSS
  #       url: /atom.xml

profile:
  avatar: https://github.com/username.png
  # Quiet shows tagline on Home. Profile About uses bio when no About Issue exists.
  # tagline: Researcher / tool builder
  # bio: A short bio about yourself.
  links:
    - name: GitHub
      url: https://github.com/username

# Omit about to discover the sole valid published About Issue, or use Profile
# About when none exists. An explicit invalid selection fails, never falls back.
about:
  issue_number: 1

# This is the process environment variable NAME, never the token value.
security:
  token_env: GITHUB_TOKEN

# ============================================
# Branding (optional)
# ============================================
# branding:
#   show_powered_by: true
#   powered_by_text: Powered by
#   powered_by_url: https://github.com/geoqiao/escaping
#   source_link_url: ""

# ============================================
# Paths (optional)
# page_size is a positive integer, default 10
# ============================================
# paths:
#   output: output
#   page_size: 10

# ============================================
# Theme (optional; defaults to built-in Quiet)
# Local Theme paths are relative to this Config file's directory.
# ============================================
theme:
  source: builtin
  name: Quiet # The only built-in Theme; use source: local for another design.

# Local Theme example:
# theme:
#   source: local
#   name: my-theme
#   path: theme

# ============================================
# SEO (optional)
# ============================================
# seo:
#   google_search_console: ""

# ============================================
# Comments (optional, disabled by default)
# To enable, authorize https://github.com/apps/utterances for the public repository
# and set enabled: true. Configuration alone does not install/authorize the App.
# repo falls back to github.repo when empty
# theme_mode: auto follows the blog theme; fixed uses comments.theme
# ============================================
# comments:
#   enabled: false
#   repo: ""
#   theme: github-light
#   theme_mode: auto

# ============================================
# Projects (optional)
# ============================================
# Only selected repositories are read. A minimal entry is:
# projects:
#   - repository: username/project
# Missing slug = full repository.casefold(); title/summary use public repo data.
# Explicit title/summary (including summary: "") win; API rename cannot change
# the configured identity/key/link. Duplicate final catalog keys fail.
# Expanded entry:
# projects:
#   - slug: my-project
#     title: My Project
#     repository: username/project
#     summary: A great project
#     featured: true
#     order: 1
#     fallback_metadata:
#       stars: 100
#       forks: 10
#       language: Python
#       topics:
#         - web
#     # Prefer an HTTPS image URL pinned to an immutable commit:
#     # image: https://raw.githubusercontent.com/username/project/<commit-sha>/preview.webp
#     # Root-relative images must be assets from the selected local Theme:
#     # image: /templates/my-theme/static/images/project.webp
#     # links:
#     #   - name: Demo
#     #     url: https://demo.example.com/
