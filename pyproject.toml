[project]
name = "escpe"
version = "0.1.0"
description = "An opinionated GitHub Issues personal-site generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.4",
    "marko>=2.1.2",
    "pygithub>=2.4.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.2",
    "structlog>=23.1.0",
    "tenacity>=8.2.0",
]

[project.scripts]
escpe = "escaping.cli:run_cli"

[tool.setuptools.package-data]
escaping = [
    "static/*.js",
    "themes/*/*.html",
    "themes/*/*.yaml",
    "themes/*/*.md",
    "themes/*/static/css/*",
    "themes/*/static/js/*",
    "themes/*/static/images/*",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "playwright>=1.4",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "ty>=0.0.25",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
    "ANN", # flake8-annotations
]
ignore = [
    "E501", # 忽略行长限制
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests
"tests/test_atom_feed.py" = ["S101", "S314"]  # Assert + stdlib XML parse in feed tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src --cov-report=term-missing"
