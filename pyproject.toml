[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "escpe"
version = "0.6.0"
description = "An opinionated GitHub Issues personal-site generator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "geoqiao" }]
keywords = ["github-issues", "blog", "static-site-generator", "cms"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "marko>=2.1.2",
    "nh3==0.3.7",
    "pygithub>=2.4.0",
    "pydantic>=2.0.0",
    "pygments==2.21.0",
    "pyyaml>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/geoqiao/escaping"
Changelog = "https://github.com/geoqiao/escaping/blob/main/CHANGELOG.md"
Issues = "https://github.com/geoqiao/escaping/issues"

[project.scripts]
escpe = "escpe.cli:run_cli"

[tool.setuptools.package-data]
escpe = [
    "static/*.js",
    "static/mermaid/*",
    "themes/**/*",
]

[tool.uv]
package = true

[dependency-groups]
# Keep aligned with build-system.requires; uv.lock selects the backend version.
build = ["setuptools>=77"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "playwright>=1.40",
    "ruff>=0.1.0",
    "ty>=0.0.25",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
    "ANN", # flake8-annotations
]
ignore = [
    "E501", # 忽略行长限制
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=src --cov-report=term-missing"
