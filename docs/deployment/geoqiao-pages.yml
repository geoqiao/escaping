# Copy this file to geoqiao/geoqiao.github.io/.github/workflows/pages.yml.
# This file is a template only. The production workflow remains owned by the
# site repository. Keep the compiler ref at a reviewed full 40-character SHA.
name: Build and deploy geoqiao.me

on:
  workflow_dispatch:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  push:
    paths:
      - ".github/workflows/pages.yml"
      - "config.yaml"
      - "content-migrations/**"
      - "scripts/**"
      - "tests/**"
      - "theme/**"
      - "CNAME"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned escaping compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: geoqiao/escaping
          ref: REVIEWED_FULL_SHA # replace with a reviewed full 40-character compiler SHA
          path: compiler
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: compiler/uv.lock
          version: "0.12.0"

      - name: Set up Python
        run: uv python install 3.11

      - name: Test site migration tooling
        run: python3 -m unittest -v tests/test_render_slug_redirects.py

      - name: Generate site from the site Config
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run --project "$GITHUB_WORKSPACE/compiler" --frozen
          escpe --config "$GITHUB_WORKSPACE/config.yaml"

      # Site-owned redirect post-processing and final artifact validation.
      - name: Render and validate final Pages artifact
        run: >-
          python3 scripts/render_slug_redirects.py
          --map content-migrations/blog-slugs-2026-08.json
          --output output
          --repository-root "$GITHUB_WORKSPACE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
