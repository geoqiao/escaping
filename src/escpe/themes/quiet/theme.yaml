# Quiet — neutral surfaces and restrained avatar-magenta accents.
# Set these under theme.options in config.yaml; see docs/themes/quiet.md.
api: 4

options:
  tagline:
    type: string
    default: ""
    description: One line shown above the bio on Home.
  featured_posts:
    type: posts
    default: []
    description: Blog Issue numbers shown under Featured on Home, in this order.
  footer_text:
    type: string
    default: ""
    description: Footer note next to the author name; empty uses "Thanks for reading."
  show_powered_by:
    type: boolean
    default: true
    description: Show the "Powered by escaping" footer link.
  accent_color:
    type: color
    default: ""
    description: Accent color in light mode, e.g. "#a72f6a"; empty keeps Quiet's.
  accent_color_dark:
    type: color
    default: ""
    description: Accent color in dark mode, e.g. "#e58bb6"; empty keeps Quiet's.
  comments_theme:
    type: choice
    values: [github-light, github-dark, preferred-color-scheme, github-dark-orange, icy-dark, dark-blue, photon-dark, boxy-light, gruvbox-dark]
    default: github-light
    description: Utterances color theme used when comments_theme_mode is fixed.
  comments_theme_mode:
    type: choice
    values: [auto, fixed]
    default: auto
    description: auto follows Quiet's light/dark mode; fixed always uses comments_theme.

