# Quiet — neutral surfaces and restrained avatar-magenta accents.
api_version: "1"
capabilities: [home, blog, ideas, about, projects, tags, comments, responsive, dark-mode]
required_templates:
  - base.html
  - home.html
  - index.html
  - post.html
  - tag.html
  - tags.html
  - ideas.html
  - idea.html
  - about.html
  - projects.html
required_assets:
  - static/css
  - static/js
  - static/fonts
  - static/images
