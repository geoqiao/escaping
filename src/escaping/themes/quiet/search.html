<dialog id="site-search" class="search-dialog" aria-labelledby="search-title" lang="{{ t.language }}">
  <div class="search-header">
    <h2 id="search-title">{{ t.search }}</h2>
    <button class="search-close" type="button" aria-label="{{ t.search_close }}">Esc <span aria-hidden="true">×</span></button>
  </div>
  <form class="search-form" role="search">
    <label for="search-query" class="search-label">{{ t.search_label }}</label>
    <div class="search-input-row"><span aria-hidden="true">⌕</span><input id="search-query" type="search" maxlength="200" placeholder="{{ t.search_placeholder }}" autocomplete="off" spellcheck="false" aria-describedby="search-scope" autofocus></div>
  </form>
  <p id="search-scope" class="search-scope">{{ t.search_scope }}</p>
  <p class="search-status" role="status" aria-live="polite" aria-atomic="true" data-loading="{{ t.search_loading }}" data-failed="{{ t.search_failed }}" data-empty="{{ t.search_empty }}" data-no-results="{{ t.search_no_results }}" data-browse="{{ t.search_browse }}" data-count-one="{{ t.search_count_one }}" data-count="{{ t.search_count }}" data-truncated="{{ t.search_truncated }}"></p>
  <div class="search-error" hidden>
    <button type="button" class="search-retry">{{ t.search_retry }}</button>
    <a href="{{ site.routes.blog.canonical_path }}">{{ t.browse_blog }}</a>
    <a href="{{ site.routes.tags.canonical_path }}">{{ t.browse_tags }}</a>
  </div>
  <ul class="search-results" aria-label="{{ t.search_results }}"></ul>
  <div class="search-footer"><span>{{ t.search_select_hint }}</span><span>{{ t.search_close_hint }}</span></div>
</dialog>
